[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bee"
version = "0.1.0"
description = "An open-source AI coding agent built from scratch."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
bee = "bee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
