[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bee"
version = "0.1.0"
description = "An open-source AI coding agent built from scratch."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
bee = "bee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]